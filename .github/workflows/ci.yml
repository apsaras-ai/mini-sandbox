name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt (one-time bootstrap)
        run: |
          cargo fmt --all
          if ! git diff --quiet && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add src
            git commit -m "style: rustfmt sources"
            git push origin HEAD:master
          fi
      - name: Ensure system Node.js path for executor tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs
          test -x /usr/bin/node
      - run: cargo fmt --all -- --check
      - run: sudo apt-get update && sudo apt-get install -y nodejs
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
